<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="birthday-card">
        <div class="cake">🎂</div>

        <h1>Chúc Mừng Sinh Nhật!</h1>

        <h2>Gửi bạn Tuyền</h2>

        <p>
            Chúc bạn có một ngày sinh nhật thật vui vẻ, 
            tràn đầy hạnh phúc, may mắn và luôn nở nụ cười trên môi.
        </p>

        <p>
            Mong rằng tuổi mới sẽ mang đến cho bạn thật nhiều thành công,
            sức khỏe và những điều tuyệt vời nhất.
        </p>

        <button>Happy Birthday 🎉</button>
    </div>

</body>
</html>
